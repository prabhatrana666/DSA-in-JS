<html>

<head>
    <title>Day- 4(Delete Element in Array)</title>
</head>

<body>
    <h1>This is Day-4</h1>
    <script>
        let array = [10, 20, 30, 12, 19, 92];
        let position = 2;
        let i = 0;
        console.log("Before", array);
        for (i; i <= array.length; i++) {
            // console.log(i);
            if (i == position) {
                array[i] = array[i + 1];
            }
        }
        console.log("After", array);
    </script>
</body>

</html>
